<div class="swiper-slide card__slide">
  <div class="card__item">
    <div class="card__item-tags">
      @@tags
    </div>
    <div class="card__item-controls">
      @@control
    </div>
    <a class="card__item-img" href="@@link">
      <img src="@@img" alt="">
    </a>
    <div class="card__item-content">
      <div class="card__item-wrap">
        <a class="card__item-name h5" href="@@link">
          @@name
        </a>
        <div class="card__item-text">
          <p>
            Артикул: <span>2321421412414</span>
          </p>
          <p>
            Модификация: <span>032 мм</span>
          </p>
        </div>
        <div class="card__item-art">
          Артикул <span>@@articul</span>
        </div>
      </div>
      <div class="card__item-wrap">
        <div class="card__item-value">
          <div class="card__item-price">
            <div class="h3">
              @@price ₽
            </div>
          </div>
          <div class="card__item-sale">
            опт.: @@sale ₽
          </div>
        </div>
        <div class="card__item-wrapper">
          <button class="card__item-btn btn btn--blue" data-notif="notif-cart">
            В корзину
            <span>
              <i class="icon-cart-min"></i>
            </span>
          </button>
          <button class="card__item-btn--favorite">
            <i class="icon-favorite-fill-min"></i>
          </button>
        </div>
        <button class="card__item-plus">
          <i class="icon-plus"></i>
        </button>
      </div>
    </div>
  </div>
</div>
